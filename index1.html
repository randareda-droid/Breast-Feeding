<html lang="en">

<title>Reem & Lina — Postpartum Nutrition Plan</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Lato:wght@300;400;700&family=Tajawal:wght@300;400;700&display=swap');
:root{--cream:#fff5f8;--warm:#fde8f0;--accent:#e8709a;--pink:#d4457a;--deep:#8b1a50;
  --green:#3a8c6a;--gold:#c89a30;--text:#2d0a1a;--muted:#7a4060;--blush:#f5c0d0}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Lato',sans-serif;background:var(--cream);color:var(--text)}
/* LANG BAR */
.lang-bar{display:flex;justify-content:center;background:#fff;padding:10px;border-bottom:1px solid var(--blush);gap:8px;position:sticky;top:0;z-index:100}
.lbtn{padding:6px 22px;border-radius:20px;border:2px solid var(--blush);background:#fff;cursor:pointer;font-weight:700;font-size:0.82rem;color:var(--muted);transition:all .2s}
.lbtn.on{background:var(--deep);border-color:var(--deep);color:#fff}
/* HERO */
.hero{background:linear-gradient(135deg,#8b1a50 0%,#c04580 50%,#e8709a 100%);padding:44px 24px 36px;text-align:center;position:relative;overflow:hidden}
.hero::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at 20% 80%,rgba(255,255,255,.1) 0%,transparent 60%)}
.hero-icon{font-size:50px;margin-bottom:10px;position:relative}
.hero-title{font-family:'Playfair Display',serif;font-size:1.9rem;color:#fff;line-height:1.3;margin-bottom:8px;position:relative}
.hero-sub{color:rgba(255,255,255,.88);font-size:0.95rem;position:relative}
/* TABS */
.tab-bar{display:flex;background:#fff;border-bottom:2px solid var(--blush);overflow-x:auto;scrollbar-width:none;position:sticky;top:56px;z-index:99;box-shadow:0 2px 8px rgba(139,26,80,.08)}
.tab-bar::-webkit-scrollbar{display:none}
.tab-btn{flex:1;min-width:80px;padding:13px 6px;text-align:center;cursor:pointer;font-size:0.65rem;font-weight:700;text-transform:uppercase;color:var(--muted);border-bottom:3px solid transparent;white-space:nowrap;transition:all .2s;border:none;background:none}
.tab-btn:hover{color:var(--pink)}
.tab-btn.on{color:var(--deep);border-bottom:3px solid var(--deep)}
/* SECTIONS */
.sec{display:none;padding:26px 18px;max-width:900px;margin:0 auto}
.sec.on{display:block}
/* CARDS */
.card{background:#fff;border-radius:14px;padding:20px;margin-bottom:16px;box-shadow:0 2px 14px rgba(139,26,80,.08);border-left:4px solid var(--accent)}
.card.g{border-left-color:var(--green)}.card.gold{border-left-color:var(--gold)}
.card.pk{border-left-color:var(--pink)}.card.red{border-left-color:#c0392b}
.card.bp{border-left-color:#7040d0;background:linear-gradient(135deg,#faf8ff,#f0ecff)}
.card.nv{border-left-color:var(--deep)}
.ct{font-family:'Playfair Display',serif;font-size:1.1rem;color:var(--deep);margin-bottom:11px;display:flex;align-items:center;gap:8px}
.ar .ct{font-family:'Tajawal',sans-serif}
/* GRIDS */
.ngrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:12px;margin-bottom:16px}
.nbox{background:linear-gradient(135deg,#fff5f8,#fde8f0);border-radius:10px;padding:14px;text-align:center;border:1px solid var(--blush)}
.nbox .icon{font-size:26px;margin-bottom:5px}.nbox .lbl{font-size:0.68rem;color:var(--muted);text-transform:uppercase;letter-spacing:1px}
.nbox .val{font-size:1.2rem;font-weight:700;color:var(--deep)}.nbox .unit{font-size:0.75rem;color:var(--muted)}
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.fi{background:var(--warm);border-radius:10px;padding:12px;text-align:center;border:1px solid var(--blush)}
.fi .icon{font-size:22px;margin-bottom:4px}.fi .nm{font-size:0.8rem;font-weight:700;color:var(--text)}
.fi .why{font-size:0.68rem;color:var(--muted);margin-top:2px}
.fi .por{font-size:0.66rem;color:var(--pink);margin-top:3px;font-weight:700;background:#fff0f5;border-radius:5px;padding:2px 4px;display:inline-block}
.dgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}
.dc{background:linear-gradient(135deg,#fff5f8,#fde8f0);border-radius:12px;padding:16px;border:1px solid var(--blush);text-align:center}
.dc .di{font-size:30px;margin-bottom:6px}.dc .dn{font-weight:700;font-size:0.88rem;color:var(--deep);margin-bottom:4px}
.dc .dd{font-size:0.73rem;color:var(--muted);line-height:1.5}
/* DAY PLAN */
.day-sel{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
.dbtn{padding:7px 14px;border:2px solid var(--blush);border-radius:18px;background:#fff;cursor:pointer;font-size:0.8rem;font-weight:700;color:var(--muted);transition:all .2s}
.dbtn.on{background:var(--deep);border-color:var(--deep);color:#fff}
.mblock{display:flex;gap:12px;margin-bottom:12px}
.mtc{min-width:68px;text-align:right}
.ar .mtc{text-align:left}
.mtime{font-size:0.7rem;font-weight:700;color:var(--pink);text-transform:uppercase}
.mtype{font-size:0.63rem;color:var(--muted)}
.mdot{width:11px;height:11px;border-radius:50%;background:var(--pink);flex-shrink:0;margin-top:3px;position:relative;z-index:1}
.mdot::after{content:'';position:absolute;left:4px;top:11px;width:2px;height:calc(100% + 12px);background:var(--blush)}
.mblock:last-child .mdot::after{display:none}
.mc{flex:1;background:#fff;border-radius:10px;padding:12px 14px;box-shadow:0 2px 6px rgba(139,26,80,.06)}
.mn{font-weight:700;font-size:0.88rem;color:var(--text);margin-bottom:5px}
.mrows{font-size:0.8rem;color:var(--muted)}
.mrow{display:flex;justify-content:space-between;padding:2px 0;border-bottom:1px dashed #f5d0e0}
.mrow:last-child{border-bottom:none}
.iqty{color:var(--pink);font-weight:700;font-size:0.76rem;white-space:nowrap;margin-left:6px}
.mcal{display:inline-block;background:var(--warm);color:var(--deep);font-size:0.68rem;font-weight:700;padding:2px 10px;border-radius:8px;margin-top:6px}
/* FEEDING */
.fstep{display:flex;gap:12px;margin-bottom:14px;align-items:flex-start}
.snum{width:32px;height:32px;border-radius:50%;background:var(--deep);color:#fff;font-weight:700;font-size:0.88rem;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.stitle{font-size:0.9rem;font-weight:700;color:var(--deep);margin-bottom:3px}
.sbody{font-size:0.8rem;color:var(--muted);line-height:1.6}
/* SUPPS */
.sgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px;margin-top:12px}
.sc{background:#fff;border-radius:12px;padding:16px;border:1px solid var(--blush);box-shadow:0 2px 6px rgba(139,26,80,.05)}
.sci{font-size:26px;margin-bottom:6px}.scn{font-weight:700;font-size:0.9rem;color:var(--deep);margin-bottom:3px}
.scd{font-size:0.76rem;color:var(--muted);line-height:1.6;margin-bottom:7px}
.sv{display:inline-block;font-size:0.68rem;font-weight:700;padding:2px 9px;border-radius:9px}
.sv.ok{background:#e8f8ee;color:#2a7a4a;border:1px solid #a0d8b0}
.sv.ca{background:#fff3e0;color:#8a5000;border:1px solid #f0c070}
.sv.no{background:#fff0f0;color:#c02020;border:1px solid #f0a0a0}
/* HERBS */
.htab{width:100%;border-collapse:collapse;font-size:0.8rem;margin-top:10px}
.htab th{background:linear-gradient(90deg,var(--deep),var(--pink));color:#fff;padding:9px 11px;text-align:left;font-weight:700}
.htab td{padding:9px 11px;border-bottom:1px solid var(--blush);vertical-align:top;line-height:1.5}
.htab tr:nth-child(even) td{background:#fff8fa}
.badge{display:inline-block;font-size:0.67rem;font-weight:700;padding:2px 8px;border-radius:9px}
.badge.ok{background:#e0f5ea;color:#1a7a40;border:1px solid #90d0b0}
.badge.lm{background:#fff5d8;color:#8a5500;border:1px solid #d8b040}
.badge.no{background:#ffe8e8;color:#b02020;border:1px solid #e08080}
/* AVOID */
.agrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:9px}
.ai{background:#fff5f5;border:1px solid #ffd0d0;border-radius:9px;padding:11px;text-align:center;font-size:0.78rem;color:#c0392b;font-weight:700}
/* TIPS */
.tlist{list-style:none}
.tlist li{display:flex;align-items:flex-start;gap:10px;padding:10px 0;border-bottom:1px solid var(--blush);font-size:0.86rem;line-height:1.6}
.tlist li:last-child{border-bottom:none}
.tico{font-size:18px;flex-shrink:0;margin-top:1px}
/* TAGS */
.tag{display:inline-block;background:var(--warm);color:var(--deep);font-size:0.69rem;font-weight:700;padding:3px 9px;border-radius:9px;margin:2px;border:1px solid var(--blush)}

.cal-row{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:14px}
.cbox{flex:1;min-width:100px;background:linear-gradient(135deg,var(--deep),var(--pink));border-radius:10px;padding:12px;text-align:center;color:#fff}
.cbox .cv{font-size:1.3rem;font-weight:700}.cbox .cl{font-size:0.68rem;opacity:.85;text-transform:uppercase;letter-spacing:1px}
.banner{background:linear-gradient(135deg,#fde8f0,#fcd0e0);border-radius:12px;padding:16px 20px;margin-bottom:18px;display:flex;align-items:center;gap:12px;border:1px solid var(--blush)}
.banner-icon{font-size:38px}
.bptitle{font-size:0.9rem;font-weight:700;color:var(--deep);margin-bottom:3px}
.bpsub{font-size:0.8rem;color:var(--pink)}
.alert-box{background:linear-gradient(135deg,#fff0f5,#ffe0ec);border:2px solid #f090b0;border-radius:12px;padding:14px 18px;margin-bottom:16px;display:flex;align-items:flex-start;gap:12px}
.wbar{margin:10px 0}.wlabel{display:flex;justify-content:space-between;font-size:0.8rem;margin-bottom:5px}
.wtrack{height:16px;background:#fde0ec;border-radius:18px;overflow:hidden}
.wfill{height:100%;background:linear-gradient(90deg,var(--pink),var(--accent));border-radius:18px;width:82%}
.stitle-h{font-family:'Playfair Display',serif;font-size:1.5rem;color:var(--deep);margin-bottom:5px}
.ar .stitle-h{font-family:'Tajawal',sans-serif}
.ssub{color:var(--muted);font-size:0.86rem;margin-bottom:20px}
.prow{background:#fff8fa;border-radius:10px;padding:12px 14px;margin-bottom:9px;border:1px solid var(--blush);display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:10px}
.pleft{flex:1;min-width:180px}.pname{font-weight:700;font-size:0.9rem;color:var(--deep);margin-bottom:7px}
.pitems{padding-left:14px;color:var(--muted);font-size:0.76rem;line-height:1.7}
.ar .pitems{padding-right:14px;padding-left:0}
.ptarget{background:var(--deep);color:#fff;border-radius:18px;padding:3px 12px;font-size:0.76rem;font-weight:700;display:inline-block;margin-bottom:5px}
.pkcal{font-size:0.69rem;color:var(--pink);line-height:1.5;text-align:center}
.bpgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.bpcard{background:#fff;border-radius:9px;padding:13px;border:1px solid #d0c0f0}
.bptop{font-weight:700;color:#6040c0;margin-bottom:5px;font-size:0.86rem}
.bptext{font-size:0.76rem;color:var(--muted);line-height:1.7}
footer{text-align:center;padding:22px;font-size:0.73rem;color:var(--muted);border-top:1px solid var(--blush)}
.ar{direction:rtl;font-family:'Tajawal',sans-serif}
</style>
</head>

var RENDERERS = {needs:renderNeeds, bp:renderBP, foods:renderFoods, drinks:renderDrinks, plan:renderPlan, feeding:renderFeeding, supps:renderSupps, avoid:renderAvoid};

function buildPage() {
  var l = currentLang;
  var ar = l==='ar';
  var C = CONTENT[l];
  var tabs = C.tabs.map(function(t,i){
    var active = i===C.tabIds.indexOf(currentTab)?' on':'';
    return '<button class="tab-btn'+active+'" data-tabid="'+C.tabIds[i]+'">'+t+'</button>';
  }).join('');
  var secHtml = C.tabIds.map(function(id){
    var active = id===currentTab?' on':'';
    return '<div class="sec'+active+'" id="sec-'+id+'">'+RENDERERS[id](l)+'</div>';
  }).join('');
  document.getElementById('app').innerHTML = `
    <div class="hero">
      <div class="hero-icon">🤱</div>
      <div class="hero-title">${C.heroTitle}</div>
      <div class="hero-sub">${C.heroSub}</div>
    </div>
    <div class="tab-bar">${tabs}</div>
    <div class="${ar?'ar':''}" style="min-height:400px">${secHtml}</div>
    <footer>${C.footer}</footer>`;
  // attach tab click handlers
  document.querySelectorAll('.tab-btn').forEach(function(btn){
    btn.addEventListener('click', function(){showTab(this.getAttribute('data-tabid'));});
  });
  // re-init plan if active
  if(currentTab==='plan') initPlan();
}

function showTab(id) {
  currentTab = id;
  buildPage();
  window.scrollTo(0,0);
}

function switchLang(l) {
  currentLang = l;
  document.getElementById('btn-en').classList.toggle('on', l==='en');
  document.getElementById('btn-ar').classList.toggle('on', l==='ar');
  buildPage();
}

// ─── MEAL PLAN ──────────────────────────────────────────────────────────────
function initPlan() {
  var ar = currentLang==='ar';
  var selEl = document.getElementById('day-sel');
  var tlEl = document.getElementById('meal-timeline');
  if(!selEl||!tlEl) return;
  selEl.innerHTML = mealPlans.map(function(d,i){
    var parts = d.day.split(' / ');
    var label = ar?(parts[1]||parts[0]):parts[0];
    var cls = 'dbtn'+(i===currentDay?' on':'');
    return '<button class="'+cls+'" onclick="selectDay('+i+')">'+label+'</button>';
  }).join('');
  renderMeals();
}

function selectDay(i) {
  currentDay = i;
  document.querySelectorAll('.dbtn').forEach((b,j)=>b.classList.toggle('on',j===i));
  renderMeals();
}

function renderMeals() {
  var ar = currentLang==='ar';
  var plan = mealPlans[currentDay];
  var tlEl = document.getElementById('meal-timeline');
  if(!tlEl) return;
  tlEl.innerHTML = plan.meals.map(function(m,mi){
    var nameParts = m.name.split(' / ');
    var typeParts = m.type.split('/');
    var name = ar?(nameParts[1]||nameParts[0]):nameParts[0];
    var type = ar?(typeParts[1]?typeParts[1].trim():typeParts[0]):typeParts[0].trim();
    var rows = m.rows.map(function(r){return '<div class="mrow"><span>'+r[0]+'</span><span class="iqty">'+r[1]+'</span></div>';}).join('');
    return '<div class="mblock"><div class="mtc"><div class="mtime">'+m.time+'</div><div class="mtype">'+type+'</div></div><div class="mdot"></div><div class="mc"><div class="mn">🍽️ '+name+'</div><div class="mrows">'+rows+'</div><span class="mcal">'+exactCals[currentDay][mi]+' kcal</span></div></div>';
  }).join('');
  var total = exactCals[currentDay].reduce((a,b)=>a+b,0);
  var totalLabel = ar ? ('📊 مجموع اليوم: '+total+' سعر | الهدف: ١٨٠٠–٢٠٠٠ سعر · صوديوم منخفض') : ('📊 Daily Total: '+total+' kcal | Target: 1,800–2,000 kcal · Low-sodium DASH');
  tlEl.innerHTML += '<div style="margin-top:10px;padding:10px 14px;background:linear-gradient(135deg,var(--deep),var(--pink));color:#fff;border-radius:10px;font-weight:700;font-size:0.88rem">'+totalLabel+'</div>';
}

// ─── INIT ────────────────────────────────────────────────────────────────────
buildPage();
</script>
</body>
</html>
